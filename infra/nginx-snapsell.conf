# /etc/nginx/sites-available/snapsell  →  symlink into sites-enabled, then:
#   certbot --nginx -d snapsell.finessedev.space
server {
    listen 80;
    server_name snapsell.finessedev.space;

    # Product and parcel photos, up to 8 MB.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:4090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The shopping agent streams tool steps and the haggle as server-sent events.
        # Buffering would hold everything until the end.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
